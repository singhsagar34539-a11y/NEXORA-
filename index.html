<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA - Play. Skill Up. Grow.</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#0b1020;
  color:white;
  min-height:100vh;
}

header{
  background:#121a31;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #26304d;
}

.logo{
  font-size:25px;
  font-weight:bold;
  letter-spacing:1px;
}

.logo span{
  color:#6c63ff;
}

.menu-btn{
  background:#202b4b;
  border:0;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  font-size:20px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.hero{
  text-align:center;
  padding:25px 10px;
}

.hero h1{
  font-size:38px;
  margin-bottom:8px;
}

.hero h1 span{
  color:#6c63ff;
}

.hero p{
  color:#aeb8d0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}

.stat{
  background:#151e38;
  padding:15px 8px;
  border-radius:14px;
  text-align:center;
  border:1px solid #273253;
}

.stat b{
  display:block;
  font-size:22px;
  color:#7c73ff;
}

.stat small{
  color:#aeb8d0;
}

.games{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:#151e38;
  border:1px solid #293452;
  border-radius:18px;
  padding:22px 15px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.card:active{
  transform:scale(.97);
}

.card .icon{
  font-size:38px;
  margin-bottom:10px;
}

.card h3{
  margin-bottom:6px;
}

.card p{
  color:#9eabc7;
  font-size:13px;
}

button{
  border:0;
  cursor:pointer;
}

.primary{
  width:100%;
  background:#6c63ff;
  color:white;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin-top:15px;
}

.secondary{
  width:100%;
  background:#202b4b;
  color:white;
  padding:13px;
  border-radius:12px;
  font-size:15px;
  margin-top:10px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.game-box{
  background:#151e38;
  border:1px solid #293452;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}

.back{
  background:none;
  color:#aeb8d0;
  font-size:15px;
  margin-bottom:10px;
}

.question{
  font-size:21px;
  line-height:1.5;
  margin:20px 0;
}

.option{
  width:100%;
  padding:14px;
  margin:8px 0;
  background:#202b4b;
  color:white;
  border-radius:11px;
  text-align:left;
  font-size:15px;
}

.option:hover{
  background:#303d65;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#202b4b;
  color:#dce3f7;
}

input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #354363;
  background:#0d1428;
  color:white;
  font-size:16px;
  outline:none;
}

.ref-box{
  background:#151e38;
  padding:20px;
  border-radius:18px;
  border:1px solid #293452;
  margin-top:20px;
}

.ref-code{
  background:#0b1020;
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-size:20px;
  letter-spacing:2px;
  margin:15px 0;
  color:#8b83ff;
}

.premium{
  background:linear-gradient(135deg,#1d2650,#38296b);
  border:1px solid #6256d9;
  padding:22px;
  border-radius:18px;
  margin-top:20px;
}

.premium h2{
  margin-bottom:8px;
}

.premium p{
  color:#c9d0e5;
